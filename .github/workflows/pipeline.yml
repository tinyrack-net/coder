name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      package_release:
        description: Build release packages without publishing a GitHub Release
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8
  TINYRACK_DART_PACKAGES_REF: f1a2fe524b9025fdfb9d34a57073285ea368e11e
  # wrangler-action defaults to 3.90.0, which predates Workers static assets
  # and rejects an `assets` config for having no script entry-point.
  WRANGLER_VERSION: 4.118.0
  APPIMAGETOOL_SHA256: >-
    a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
  NFPM_VERSION: 2.47.0
  NFPM_SHA256: >-
    3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') &&
    github.event_name != 'workflow_dispatch' }}

jobs:
  static-linux:
    name: Static checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: dart run melos format:check
      - run: dart run melos analyze
      - run: dart run melos dependencies:check
      - run: dart run melos tinyrack-sources:check
      - run: dart run melos architecture:check
      - run: dart run melos features:check
      - name: Validate the workflow
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

  generated-linux:
    name: Generated sources
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: dart run melos generate:check

  dart-tests:
    name: Dart tests (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: true
      matrix:
        os:
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: dart run melos test:dart

  flutter-tests:
    name: Flutter tests (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: true
      matrix:
        os:
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: dart run melos test:flutter

  coverage-dart-linux:
    name: Dart coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: dart run melos test:coverage:dart
      - name: Enforce Dart package coverage
        run: >-
          dart run tool/verify_coverage.dart
          --scope=coder_agent
          --scope=coder_client
          --scope=coder_daemon
          --scope=coder_protocol
          --scope=coder_provider_openai

  coverage-flutter-linux:
    name: Flutter coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: dart run melos test:coverage:flutter
      - run: dart run tool/verify_coverage.dart --scope=coder_app

  golden-linux:
    name: Linux goldens
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: dart run melos test:golden

  debug-e2e-linux:
    name: Linux Debug E2E (${{ matrix.shard }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: daemon-workspace
            test: daemon_workspace_e2e_test.dart
          - shard: project-worktree
            test: project_worktree_e2e_test.dart
          - shard: session-turn-agent-skill-mcp-provider
            test: debug_e2e_test.dart
          - shard: provider
            test: provider_e2e_test.dart
          - shard: settings-desktop
            test: settings_desktop_e2e_test.dart
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/install-linux-desktop-deps
        with:
          extra-packages: xvfb
      - run: dart pub get --enforce-lockfile
      - run: >-
          xvfb-run -a flutter test
          integration_test/${{ matrix.test }} -d linux
        working-directory: apps/coder_app

  mobile-debug-build:
    name: Mobile Debug Build (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            gradle_cache: true
            command: flutter build apk --debug -t lib/main_mobile.dart
          - os: macos-26
            gradle_cache: false
            command: >-
              flutter build ios --debug --simulator --no-codesign
              -t lib/main_mobile.dart
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - name: Set up Gradle cache
        if: matrix.gradle_cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
      - run: dart pub get --enforce-lockfile
      - run: ${{ matrix.command }}
        working-directory: apps/coder_app

  desktop-debug-build:
    name: Desktop Debug Build (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            command: flutter build macos --debug -t lib/main_desktop.dart
          - os: windows-2025
            command: flutter build windows --debug -t lib/main_desktop.dart
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: ${{ matrix.command }}
        working-directory: apps/coder_app

  web-build:
    name: Web Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      # A dart:io import reaching the web entrypoint only fails here, so this
      # runs on every pull request rather than at release time.
      - run: dart run melos build:web:release
      - uses: actions/upload-artifact@v7
        with:
          name: web-assets
          retention-days: 7
          path: apps/coder_app/build/web
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    if: always() && github.event_name != 'schedule'
    needs:
      - static-linux
      - generated-linux
      - dart-tests
      - flutter-tests
      - coverage-dart-linux
      - coverage-flutter-linux
      - golden-linux
      - debug-e2e-linux
      - mobile-debug-build
      - desktop-debug-build
      - web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality job to succeed
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$QUALITY_RESULTS"

  build-and-package:
    name: Build & Package (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.package_release)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Flutter publishes an SDK only for x64 hosts, so neither an arm64
          # Linux nor an arm64 Windows runner can build one. macOS is the sole
          # platform with an arm64 SDK.
          - os: ubuntu-24.04
            target: linux-x64
            platform: linux
          - os: macos-15-intel
            target: macos-x64
            platform: macos
          - os: macos-26
            target: macos-arm64
            platform: macos
          - os: windows-2025
            target: windows-x64
            platform: windows
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Declared at job level so the MSIX step can test it in its own `if`; a
    # step cannot read the env it declares itself.
    env:
      MSIX_IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - if: matrix.platform == 'linux'
        uses: ./.github/actions/install-linux-desktop-deps
        with:
          extra-packages: rpm
      - run: dart pub get --enforce-lockfile
      - name: Checkout Tinyrack Dart packages
        uses: actions/checkout@v5
        with:
          repository: tinyrack-net/dart-packages
          ref: ${{ env.TINYRACK_DART_PACKAGES_REF }}
          path: .dart_tool/tinyrack-dart-packages
      - name: Resolve shipworld workspace
        run: dart pub get --directory .dart_tool/tinyrack-dart-packages

      - name: Build release bundle
        run: dart run melos build:${{ matrix.platform }}:release

      # --- Linux ---------------------------------------------------------
      - name: Install verified appimagetool and nfpm
        if: matrix.platform == 'linux'
        run: |
          curl --fail --location --output appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum --check -
          chmod +x appimagetool
          curl --fail --location --output nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          echo "${NFPM_SHA256}  nfpm.deb" | sha256sum --check -
          sudo dpkg -i nfpm.deb
      - name: Package Linux artifacts
        if: matrix.platform == 'linux'
        env:
          BUNDLE: apps/coder_app/build/linux/x64/release/bundle
        run: |
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package linux appimage coder --input "$BUNDLE" \
            --output dist/Coder-linux-x64.AppImage --arch x86_64 \
            --tool "${GITHUB_WORKSPACE}/appimagetool"
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package linux deb coder --input "$BUNDLE" \
            --output dist/coder-linux-x64.deb --arch amd64
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package linux rpm coder --input "$BUNDLE" \
            --output dist/coder-linux-x64.rpm --arch x86_64
          tar -czf dist/Coder-linux-x64.tar.gz -C "$BUNDLE" .
      - name: Verify the Linux packages install
        if: matrix.platform == 'linux'
        run: |
          dpkg-deb --contents dist/coder-linux-x64.deb | grep 'usr/bin/coder ->'
          rpm -qpl dist/coder-linux-x64.rpm | grep '/usr/lib/coder/coder'
          # A package that builds but cannot install is the failure the
          # rendering tests cannot see.
          sudo dpkg -i dist/coder-linux-x64.deb
          test -x /usr/bin/coder
          sudo dpkg -r coder

      # --- macOS ---------------------------------------------------------
      - name: Sign and archive the macOS app
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APP: apps/coder_app/build/macos/Build/Products/Release/Coder.app
        run: |
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package macos sign coder --input "$APP" --app-bundle \
            ${{ !startsWith(github.ref, 'refs/tags/v') && '--skip-notarize' || '' }}
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package macos archive coder --input "$APP" \
            --output dist/Coder-${{ matrix.target }}.zip
          codesign --verify --deep --strict "$APP"
      - name: Report the signing identities that were available
        if: failure() && matrix.platform == 'macos'
        # `no identity found` does not say what was found instead, and the
        # identity name is printed in every signed binary, so it is safe to log.
        run: security find-identity -v -p codesigning || true

      # --- Windows -------------------------------------------------------
      - name: Build the Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path apps/coder_app/pubspec.yaml `
            -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value.Split('+')[0]
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DAppArch=${{ matrix.arch }}" `
            "/DSourceDir=$PWD\apps\coder_app\build\windows\${{ matrix.arch }}\runner\Release" `
            "/DOutputDir=$PWD\dist" `
            apps\coder_app\windows\installer\coder.iss
      - name: Build the Windows MSIX
        # Skipped until the identity secrets exist. winget takes the Inno
        # Setup installer, so a release without an MSIX is complete; the MSIX
        # is only needed for the Microsoft Store, which is not submitted yet.
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v')
          && env.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        env:
          # The publisher has to match the signing certificate subject, so
          # there is no useful default to fall back to.
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package windows msix coder
          --input apps/coder_app/build/windows/${{ matrix.arch }}/runner/Release
          --launcher coder.exe --arch ${{ matrix.arch }}
          --output dist/Coder-win-${{ matrix.arch }}.msix
          --package-root dist/msix/${{ matrix.arch }}
      - name: Archive the Windows release directory
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive
          -Path apps/coder_app/build/windows/${{ matrix.arch }}/runner/Release/*
          -DestinationPath dist/Coder-${{ matrix.target }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coder-${{ matrix.target }}
          retention-days: 7
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.msix
          if-no-files-found: error

  deploy-web:
    name: Deploy Web
    needs:
      - quality-gate
      - web-build
    # Only main and tags publish; a pull request stops at web-build.
    if: github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: apps/coder_app/build/web
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          # Read from either scope so the deployment does not depend on which
          # organisation tab the credentials live in. A secret is preferred
          # because only a secret is masked in logs.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN ||
            vars.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID ||
            vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/coder_app
          command: deploy

  build-cli:
    name: Build CLI (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.package_release)
    strategy:
      fail-fast: false
      matrix:
        include:
          # The CLI is plain Dart, but it shares a pub workspace with
          # `coder_app`, so resolving it needs the Flutter SDK and the job is
          # held to the platforms Flutter publishes one for. That rules out
          # Linux arm64, which is why `shipworld.yaml` lists the three
          # platforms below under `homebrew.platforms`.
          - os: ubuntu-24.04
            target: linux-x64
            platform: linux
          - os: macos-15-intel
            target: macos-x64
            platform: macos
          - os: macos-26
            target: macos-arm64
            platform: macos
          - os: windows-2025
            target: windows-x64
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Flutter rather than a standalone Dart SDK: `dart pub get` resolves the
      # whole workspace, and `coder_app` pulls `flutter`, `flutter_test`, and
      # `integration_test` from the Flutter SDK. The pinned Flutter bundles the
      # same Dart this job used to install directly.
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - name: Checkout Tinyrack Dart packages
        if: matrix.platform == 'macos'
        uses: actions/checkout@v5
        with:
          repository: tinyrack-net/dart-packages
          ref: ${{ env.TINYRACK_DART_PACKAGES_REF }}
          path: .dart_tool/tinyrack-dart-packages
      - name: Resolve shipworld workspace
        if: matrix.platform == 'macos'
        run: dart pub get --directory .dart_tool/tinyrack-dart-packages

      - name: Build the CLI
        shell: bash
        # `dart build cli`, not `dart compile exe`: the CLI hosts the daemon,
        # so it links the sqlite3 and PTY code assets and ships as
        # `bundle/bin/coder_cli` plus `bundle/lib/*`. The sqlite3 build hook
        # downloads a precompiled library, so this step needs network access.
        run: |
          dart build cli -t packages/coder_cli/bin/coder_cli.dart -o dist
          mkdir -p "dist/coder-cli-${{ matrix.target }}"
          cp -R dist/bundle/. "dist/coder-cli-${{ matrix.target }}/"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            mv "dist/coder-cli-${{ matrix.target }}/bin/coder_cli.exe" \
              "dist/coder-cli-${{ matrix.target }}/bin/coder-cli.exe"
          else
            mv "dist/coder-cli-${{ matrix.target }}/bin/coder_cli" \
              "dist/coder-cli-${{ matrix.target }}/bin/coder-cli"
          fi

      - name: Sign and notarize the macOS bundle
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        # Every bundled dylib is signed before the executable that loads them;
        # signing the executable first would invalidate it.
        run: |
          bundle="dist/coder-cli-${{ matrix.target }}"
          for library in "$bundle"/lib/*; do
            dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package macos sign coder-cli \
              --input "$library" --skip-notarize
          done
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package macos sign coder-cli \
            --input "$bundle/bin/coder-cli" \
            ${{ !startsWith(github.ref, 'refs/tags/v') && '--skip-notarize' || '' }}
          codesign --verify --strict "$bundle/bin/coder-cli"

      - name: Smoke-test the bundle
        # Cross-built arm64 would not run here, but every target in this matrix
        # is built on its own architecture, so the bundle has to work. Starting
        # a daemon is what proves the sqlite3 and PTY libraries resolved; a
        # bare `--version` would pass with either one missing.
        shell: bash
        run: |
          bundle="dist/coder-cli-${{ matrix.target }}/bin"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cli="$bundle/coder-cli.exe"
          else
            cli="$bundle/coder-cli"
          fi
          # Daemon-addressing flags follow the subcommand, so `provider list`
          # comes before `--listen`.
          export TINYRACK_CODER_HOME="$RUNNER_TEMP/coder-smoke"
          "$cli" --version
          "$cli" daemon start --listen 127.0.0.1:7399 &
          daemon=$!
          for _ in $(seq 1 30); do
            "$cli" provider list --listen 127.0.0.1:7399 >/dev/null 2>&1 && break
            sleep 1
          done
          "$cli" provider list --listen 127.0.0.1:7399
          kill "$daemon"

      - name: Archive the CLI bundle
        shell: bash
        # Every channel now receives an archive, because the executable needs
        # the sibling `lib/` directory that carries sqlite3 and the PTY library.
        run: |
          cd dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            7z a "coder-cli-${{ matrix.target }}.zip" \
              "coder-cli-${{ matrix.target }}/*"
          else
            tar -czf "coder-cli-${{ matrix.target }}.tar.gz" \
              "coder-cli-${{ matrix.target }}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coder-cli-${{ matrix.target }}
          retention-days: 7
          path: |
            dist/coder-cli-${{ matrix.target }}.tar.gz
            dist/coder-cli-${{ matrix.target }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs:
      - build-and-package
      - build-cli
      - quality-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Checkout Tinyrack Dart packages
        uses: actions/checkout@v5
        with:
          repository: tinyrack-net/dart-packages
          ref: ${{ env.TINYRACK_DART_PACKAGES_REF }}
          path: .dart_tool/tinyrack-dart-packages
      - run: dart pub get --directory .dart_tool/tinyrack-dart-packages

      - name: Verify the tag matches the app version
        run: dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart release verify coder

      - name: Create the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: coder-*
          path: release-assets
          merge-multiple: true

      - name: Upload the release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber

  publish-homebrew:
    name: Publish Homebrew
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Checkout Tinyrack Dart packages
        uses: actions/checkout@v5
        with:
          repository: tinyrack-net/dart-packages
          ref: ${{ env.TINYRACK_DART_PACKAGES_REF }}
          path: .dart_tool/tinyrack-dart-packages
      - run: dart pub get --directory .dart_tool/tinyrack-dart-packages
      - uses: actions/download-artifact@v8
        with:
          name: coder-macos-arm64
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          pattern: coder-cli-*
          path: cli-assets
          merge-multiple: true

      - name: Generate the Homebrew Cask
        run: |
          url="https://github.com/${{ github.repository }}/releases/download"
          dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package homebrew cask coder \
            --archive release-assets/Coder-macos-arm64.zip \
            --url "${url}/${GITHUB_REF_NAME}/Coder-macos-arm64.zip" \
            --output release-assets/coder.rb

      - name: Generate the Homebrew Formula
        # `coder-cli` declares a directory payload, so shipworld reads the four
        # `.tar.gz` bundles already attached to this release and renders a
        # Formula that installs them into `libexec` and symlinks the launcher.
        run: dart run .dart_tool/tinyrack-dart-packages/packages/shipworld/bin/shipworld.dart package homebrew formula
          coder-cli --artifacts-dir cli-assets
          --output release-assets/coder-cli.rb

      - name: Checkout the Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: tinyrack-net/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update the Homebrew tap
        run: |
          mkdir -p homebrew-tap/Casks homebrew-tap/Formula
          cp release-assets/coder.rb homebrew-tap/Casks/coder.rb
          cp release-assets/coder-cli.rb homebrew-tap/Formula/coder-cli.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/coder.rb Formula/coder-cli.rb
          git commit -m "Update coder and coder-cli to ${GITHUB_REF_NAME}" ||
            echo "No changes to commit"
          git push

  publish-winget:
    name: Publish WinGet
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Submit the WinGet manifest update
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw "WINGET_TOKEN repository secret is required for WinGet publishing."
          }

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME"
          $releaseNotesUrl = "https://github.com/${{ github.repository }}/releases/tag/$env:GITHUB_REF_NAME"

          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update tinyrack.coder `
            --version $version `
            --urls "$downloadUrl/Coder-setup-win-x64.exe|x64" `
            --release-notes-url "$releaseNotesUrl" `
            --submit `
            --no-open

          # The CLI ships as a portable zip rather than an installer, so it is
          # a separate winget package from the desktop app.
          .\wingetcreate.exe update tinyrack.coder-cli `
            --version $version `
            --urls "$downloadUrl/coder-cli-windows-x64.zip|x64" `
            --release-notes-url "$releaseNotesUrl" `
            --submit `
            --no-open

  nightly-desktop-e2e:
    name: Nightly Desktop E2E (${{ matrix.platform.os }}, ${{ matrix.shard }})
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-26
            device: macos
          - os: windows-2025
            device: windows
        shard:
          - daemon_workspace_e2e_test.dart
          - project_worktree_e2e_test.dart
          - debug_e2e_test.dart
          - provider_e2e_test.dart
          - settings_desktop_e2e_test.dart
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - run: >-
          flutter test integration_test/${{ matrix.shard }}
          -d ${{ matrix.platform.device }}
        working-directory: apps/coder_app

  nightly-android-smoke:
    name: Nightly Android Remote E2E
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: >-
            cd apps/coder_app &&
            flutter test integration_test/remote_bootstrap_smoke_test.dart
            -d emulator-5554 &&
            flutter test integration_test/provider_e2e_test.dart
            -d emulator-5554

  nightly-ios-smoke:
    name: Nightly iOS Remote E2E
    if: github.event_name == 'schedule'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - run: dart pub get --enforce-lockfile
      - name: Boot an iOS simulator
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for values in data["devices"].values() for d in values if d["isAvailable"] and "iPhone" in d["name"]))')
          xcrun simctl boot "$device_id" || true
          echo "IOS_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
      - run: >-
          flutter test integration_test/remote_bootstrap_smoke_test.dart
          -d "$IOS_DEVICE_ID" &&
          flutter test integration_test/provider_e2e_test.dart
          -d "$IOS_DEVICE_ID"
        working-directory: apps/coder_app
