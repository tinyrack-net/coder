name: Recover Release Web Deployment

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag whose commit produced the web artifact
        required: true
        type: string
      source_run_id:
        description: Successful CI run that contains the web-assets artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-web-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified web artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify the artifact run matches the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          git fetch --force origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          run_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            --jq '.head_sha')"
          run_conclusion="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            --jq '.conclusion')"
          test "$tag_sha" = "$run_sha"
          test "$run_conclusion" = "success"

      - name: Download the verified web artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: gh run download "$SOURCE_RUN_ID"
          --name web-assets
          --dir packages/app/build/web

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: 4.118.0
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN ||
            vars.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID ||
            vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/app
          command: deploy
