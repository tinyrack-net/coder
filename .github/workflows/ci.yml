name: CI

on:
  push:
  pull_request:

jobs:
  quality-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - run: dart pub get
      - run: dart run melos run generate
      - run: dart run melos run format:check
      - run: dart run melos run analyze
      - run: dart run melos run test
      - run: dart run melos run test:flutter
      - run: flutter build linux --debug -t lib/main_desktop.dart
        working-directory: apps/coder_app

  desktop-build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: flutter build macos --debug -t lib/main_desktop.dart
          - os: windows-latest
            command: flutter build windows --debug -t lib/main_desktop.dart
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
      - run: dart pub get
      - run: ${{ matrix.command }}
        working-directory: apps/coder_app

  mobile-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            command: flutter build apk --debug -t lib/main_mobile.dart
          - os: macos-latest
            command: flutter build ios --simulator --no-codesign -t lib/main_mobile.dart
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
      - run: dart pub get
      - run: ${{ matrix.command }}
        working-directory: apps/coder_app
