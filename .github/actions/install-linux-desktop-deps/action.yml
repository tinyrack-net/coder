name: Install Linux desktop dependencies
description: >-
  Install the GTK desktop toolchain, downloading the .deb files only when they
  are not already cached. The package list expands to over a hundred packages
  and fetching them from the Ubuntu mirror has stalled a single job for 13
  minutes, against a normal cost of well under a minute.

inputs:
  extra-packages:
    description: Space-separated packages appended to the shared list
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve the package list
      id: pkgs
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        set -euo pipefail
        # Sorted so that reordering the list file cannot miss the cache.
        list="$( { cat "$GITHUB_WORKSPACE/.github/linux-desktop-packages.txt"
                   tr ' ' '\n' <<< "$EXTRA_PACKAGES"; } \
                 | sed '/^[[:space:]]*$/d' | sort -u | tr '\n' ' ')"
        list="${list% }"
        echo "list=$list" >> "$GITHUB_OUTPUT"
        echo "hash=$(sha256sum <<< "$list" | cut -c1-16)" >> "$GITHUB_OUTPUT"
        # Which packages are missing depends on what the runner image already
        # ships, so the image identifies the cache. These are plain runner
        # environment variables rather than expression contexts: reading them
        # as ${{ env.ImageOS }} yields an empty string.
        echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore the cached packages
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.apt-debs
        # A miss on an image bump costs one normal download, not a broken
        # install, because apt still resolves whatever the cache lacks.
        key: >-
          apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.pkgs.outputs.image
          }}-${{ steps.pkgs.outputs.hash }}

    - name: Install the packages
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        PACKAGE_LIST: ${{ steps.pkgs.outputs.list }}
      run: |
        set -euo pipefail
        archives="$GITHUB_WORKSPACE/.apt-debs"
        fresh_lists="$RUNNER_TEMP/tinest-apt-lists"
        # apt needs `partial` before it will use custom archive or list dirs.
        sudo mkdir -p "$archives/partial" "$fresh_lists/partial"

        network_options=(
          -o Acquire::Retries=1
          -o Acquire::http::Timeout=15
          -o Acquire::https::Timeout=15
        )
        list_options=(-o Dir::State::lists=/var/lib/apt/lists)
        using_fresh_lists=false

        # Refresh into an isolated directory. A wedged mirror cannot consume
        # the 30-minute desktop job or corrupt the runner image's usable lists.
        if sudo timeout --kill-after=10s 120s apt-get update --error-on=any \
          "${network_options[@]}" \
          -o Dir::State::lists="$fresh_lists"; then
          list_options=(-o Dir::State::lists="$fresh_lists")
          using_fresh_lists=true
        else
          echo "::warning::apt index refresh failed; using runner image lists"
        fi

        download_packages() {
          sudo timeout --kill-after=10s 300s apt-get install --download-only -y \
            "${network_options[@]}" \
            "${list_options[@]}" \
            -o Dir::Cache::archives="$archives" \
            -o APT::Keep-Downloaded-Packages=true \
            $PACKAGE_LIST
        }

        # Keep every network operation bounded. If freshly downloaded indexes
        # name a package version whose mirror stalls, retry with the known-good
        # lists baked into the GitHub runner image.
        if ! download_packages; then
          if [[ "$using_fresh_lists" != true ]]; then
            echo "::error::apt download failed with runner image lists"
            exit 1
          fi
          echo "::warning::apt download failed; retrying with runner image lists"
          list_options=(-o Dir::State::lists=/var/lib/apt/lists)
          download_packages
        fi

        # All network work is complete. Never interrupt dpkg while it mutates
        # the runner: install only the package files already in the cache.
        sudo apt-get install --no-download -y \
          "${list_options[@]}" \
          -o Dir::Cache::archives="$archives" \
          -o APT::Keep-Downloaded-Packages=true \
          $PACKAGE_LIST
        # The runner user must own these for the post-job cache upload.
        sudo chown -R "$(id -u):$(id -g)" "$archives" "$fresh_lists"
