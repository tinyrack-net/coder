name: Set up Flutter
description: >-
  Install the pinned Flutter SDK. flutter-action does the caching, so this
  exists to keep the version pin, and the one host that opts out of the SDK
  cache, in a single place instead of in every job.

inputs:
  architecture:
    description: >-
      Architecture of the Flutter SDK to install, x64 or arm64. Empty means the
      runner's own. Set it to x64 on an arm64 macOS host to build an x86_64
      target: Dart compiles for the architecture it runs as, and an x86_64 SDK
      runs there through Rosetta 2. flutter-action keeps each architecture in
      its own cache path (`.../flutter/:channel:-:version:-:arch:`), so the two
      SDKs coexist on one machine rather than one being served for the other.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        # A matrix entry that names no architecture renders as an empty string
        # rather than as an absent input, which would override the default with
        # nothing, so fall back here instead of at the input.
        architecture: ${{ inputs.architecture || runner.arch }}
        # The SDK cache holds nothing this repository can prune: measured
        # against the published archives, the cached blob is the pristine SDK
        # (Windows 1.81 GB cached against a 1.8 GB archive, macOS 2.08 against
        # 2.1, Linux 1.69 against 1.5), so no precache bloat is being carried.
        #
        # That makes the payload identical either way and leaves throughput as
        # the only variable. Windows restores the blob at ~6 MB/s against
        # 48 MB/s for the same-sized blob on macOS, which cost 4.5 of the 8.5
        # minutes the critical-path job took, so Windows fetches the archive
        # from Google's CDN instead. Every other host keeps the cache.
        #
        # This is the one change here measured only by inference. If a Windows
        # setup step is not faster than the 4.5 minutes it took before, drop
        # the condition and cache unconditionally again.
        #
        # A self-hosted runner opts out of both caches entirely. The Actions
        # cache lives on GitHub, so every restore is an internet round trip
        # from the homelab, while the machine already keeps the SDK across
        # jobs: setup.sh downloads only when `$CACHE_PATH/flutter/bin/flutter`
        # is not already executable, and CACHE_PATH defaults under
        # RUNNER_TOOL_CACHE, which persists. The first job on a machine pays
        # one CDN download and the rest pay nothing. `pub-cache` is
        # deliberately left unset: it follows `cache`, so this one condition
        # governs both cache steps.
        cache: ${{ runner.environment == 'github-hosted' &&
          runner.os != 'Windows' }}
        # Restore the pub cache into the runner *instance's* own tool cache,
        # never into the shared home. The self-hosted Mac mini runs two runner
        # instances as one user; both restoring the same key into
        # ~/.pub-cache made two tars race in one directory, tearing package
        # files (EEXIST/ENOENT/EBADF storms) that `dart pub get
        # --enforce-lockfile` accepts and the native build hooks then fail to
        # compile with exit 254. runner.tool_cache is disjoint per instance
        # (01/_work/_tool vs 02/_work/_tool), so the cache key can stay
        # shared while the restore targets never overlap. flutter-action
        # exports PUB_CACHE to this path, so every later step follows.
        pub-cache-path: ${{ runner.tool_cache }}/pub-cache
