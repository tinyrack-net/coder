name: Smoke-test the CLI bundle
description: >-
  Run the built bundle end to end: host a daemon from it and drive that daemon
  with the same binary. Starting a daemon is what proves the sqlite3 and PTY
  libraries resolved from `lib/`; a bare `--version` passes with either one
  missing.

inputs:
  target:
    description: Release target name, such as linux-x64
    required: true
  platform:
    description: linux, macos, or windows
    required: true
  port:
    description: Loopback port the smoke daemon binds
    required: false
    default: '7399'

runs:
  using: composite
  steps:
    - name: Report the bundle's signing state
      if: failure() && inputs.platform == 'macos'
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      # macOS answers a rejected signature with SIGKILL and no message, so the
      # log says only `Killed: 9`. An arm64 bundle failed here on a self-hosted
      # mini while the x86_64 one passed on the same machine and both passed on
      # a hosted runner, and the job cleans its workspace, so the evidence has
      # to be taken while it still exists.
      run: |
        bundle="dist/tinest-cli-$TARGET"
        for binary in "$bundle"/bin/* "$bundle"/lib/*; do
          [ -f "$binary" ] || continue
          file "$binary" | grep -q 'Mach-O' || continue
          printf '%s\n' "--- $binary"
          codesign -dv "$binary" 2>&1 | grep -E 'Identifier|flags|Format' || true
          codesign -v "$binary" 2>&1 | head -2 || true
        done
        echo "--- what the kernel said ---"
        log show --last 2m --style compact 2>/dev/null |
          grep -iE 'tinest-cli|amfi|code signature' | head -10 || echo '(none)'
    - name: Smoke-test the bundle
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        PLATFORM: ${{ inputs.platform }}
        PORT: ${{ inputs.port }}
      # This runs the bundle where it was built, which holds even for the
      # x86_64 target now that it is produced on an arm64 mini: Rosetta 2 runs
      # it. That also means this step says nothing about which architecture
      # came out — `build-cli-bundle` checks that with `lipo`.
      run: |
        set -euo pipefail
        bundle="dist/tinest-cli-$TARGET/bin"
        if [ "$PLATFORM" = "windows" ]; then
          cli="$bundle/tinest-cli.exe"
        else
          cli="$bundle/tinest-cli"
        fi
        # A throwaway home keeps the smoke daemon off any real credentials.
        export TINYRACK_TINEST_HOME="$RUNNER_TEMP/tinest-smoke"
        "$cli" --version
        helper="$bundle/lua-tool-runtime-host"
        if [ "$PLATFORM" = "windows" ]; then
          helper="$helper.exe"
        fi
        printf '%s\n' '{"version":2,"cell_id":"smoke","sequence_id":0,"type":"invoke","payload":{"bundle":{"revision":"smoke-v2","entrypoint":"main","modules":{"main":"return {run = function(_arguments) text(\"ok\") end}"},"preload_modules":[],"markdown_assets":{}},"handler":"run","arguments":{},"tools":[],"store":{},"memory_limit_bytes":16777216}}' \
          | "$helper" "$bundle/lua_tool_runtime/bootstrap.lua" \
          | grep '"type":"completed"'
        daemon_log="$RUNNER_TEMP/tinest-smoke-daemon.log"
        daemon=''
        cleanup() {
          if [ -n "$daemon" ] && kill -0 "$daemon" 2>/dev/null; then
            kill "$daemon"
          fi
          if [ -n "$daemon" ]; then
            wait "$daemon" 2>/dev/null || true
          fi
        }
        trap cleanup EXIT

        # Wait for startup to finish before a second Windows process reads the
        # credential file while the daemon is atomically replacing it.
        "$cli" daemon start --listen "127.0.0.1:$PORT" >"$daemon_log" 2>&1 &
        daemon=$!
        ready=false
        for _ in $(seq 1 30); do
          if grep -Fq 'Tinest daemon listening on' "$daemon_log"; then
            ready=true
            break
          fi
          if ! kill -0 "$daemon" 2>/dev/null; then
            cat "$daemon_log"
            wait "$daemon"
            exit 1
          fi
          sleep 1
        done
        if [ "$ready" != true ]; then
          cat "$daemon_log"
          echo 'Timed out waiting for the Tinest daemon to become ready.' >&2
          exit 1
        fi
        # Daemon-addressing flags follow the subcommand, so `provider list`
        # comes before `--listen`.
        "$cli" provider list --listen "127.0.0.1:$PORT"
