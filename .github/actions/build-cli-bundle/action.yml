name: Build the CLI bundle
description: >-
  Build `tinest-cli` for the current runner and lay it out as the directory
  bundle every channel ships. `dart build cli` rather than `dart compile exe`,
  because hosting the daemon links the sqlite3 and PTY code assets: the
  executable loads them from a sibling `lib/` at run time.

inputs:
  target:
    description: Release target name, such as linux-x64
    required: true
  platform:
    description: linux, macos, or windows
    required: true

runs:
  using: composite
  steps:
    - name: Build the CLI
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        PLATFORM: ${{ inputs.platform }}
      # The sqlite3 build hook downloads a precompiled library, so this needs
      # network access rather than only a warm pub cache.
      run: |
        set -euo pipefail
        dart build cli -t packages/cli/bin/tinest_cli.dart -o dist
        mkdir -p "dist/tinest-cli-$TARGET"
        cp -R dist/bundle/. "dist/tinest-cli-$TARGET/"
        # `dart build cli` names the launcher after the entrypoint file; every
        # channel installs it as `tinest-cli`.
        if [ "$PLATFORM" = "windows" ]; then
          mv "dist/tinest-cli-$TARGET/bin/tinest_cli.exe" \
            "dist/tinest-cli-$TARGET/bin/tinest-cli.exe"
        else
          mv "dist/tinest-cli-$TARGET/bin/tinest_cli" \
            "dist/tinest-cli-$TARGET/bin/tinest-cli"
        fi
        (cd packages/daemon && dart run lua_tool_runtime:stage \
          --destination "../../dist/tinest-cli-$TARGET/bin")

    - name: Verify the bundle matches the target architecture
      if: inputs.platform == 'macos'
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      # `macos-x64` is built on an arm64 Mac mini through an x86_64 SDK under
      # Rosetta 2, so the host no longer says what came out. Neither does
      # running it: Rosetta runs an x86_64 bundle on the same machine that
      # would have run an arm64 one, so the smoke test passes either way.
      # Without this an arm64 build would ship under an x64 name through the
      # Homebrew formula, and the first sign would be an Intel user's crash.
      #
      # Every Mach-O file is checked rather than only the launcher, because the
      # native code assets are separate artifacts: sqlite3 downloads a
      # prebuilt library and the Lua host is compiled by a build hook, so
      # either could resolve for the wrong architecture on its own.
      run: |
        set -euo pipefail
        case "$TARGET" in
          *-x64) want=x86_64 ;;
          *-arm64) want=arm64 ;;
          *) echo "::error::Cannot tell the architecture of $TARGET"; exit 1 ;;
        esac
        status=0
        checked=0
        while IFS= read -r binary; do
          file "$binary" | grep -q 'Mach-O' || continue
          checked=$((checked + 1))
          archs="$(lipo -archs "$binary")"
          case " $archs " in
            *" $want "*) ;;
            *) echo "::error::$binary is [$archs], expected $want"; status=1 ;;
          esac
        done < <(find "dist/tinest-cli-$TARGET" -type f)
        if [ "$checked" -eq 0 ]; then
          echo "::error::Found no Mach-O files to check in the bundle"
          exit 1
        fi
        echo "Checked $checked Mach-O files for $want"
        exit "$status"
