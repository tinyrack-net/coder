include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Flutter build output carries third-party sources that fail these rules.
    # Both globs are needed: packages/app has its own options file, so an
    # exclude may resolve against either that package or the workspace root.
    - "build/**"
    - "**/build/**"
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - "**/l10n/gen/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    avoid_catches_without_on_clauses: error
    avoid_dynamic_calls: error
    cancel_subscriptions: error
    close_sinks: error
    depend_on_referenced_packages: error
    discarded_futures: error
    inference_failure_on_function_invocation: error
    inference_failure_on_untyped_parameter: error
    public_member_api_docs: error
    unawaited_futures: error
    use_build_context_synchronously: error
    # Typed ports intentionally model single capabilities. Dart 3.13
    # deprecates disabling this lint through `linter.rules`.
    one_member_abstracts: ignore

linter:
  rules:
    public_member_api_docs: true
