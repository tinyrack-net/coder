apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coder-relay
  template:
    metadata:
      labels:
        app: coder-relay
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: relay
          image: ghcr.io/tinyrack-net/coder-relay:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: coder-relay
spec:
  selector:
    app: coder-relay
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coder-relay
  annotations:
    nginx.ingress.kubernetes.io/upstream-hash-by: "$arg_serverId"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "40"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "40"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - relay.tinyrack.net
      secretName: coder-relay-tls
  rules:
    - host: relay.tinyrack.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coder-relay
                port:
                  name: http
