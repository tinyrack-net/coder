name: coder_workspace
description: Tinyrack Coder monorepo.
publish_to: none

environment:
  sdk: ^3.12.2

workspace:
  - apps/*
  - packages/*

dependencies:
  path: ^1.9.1

dev_dependencies:
  coverage: ^1.15.1
  dependency_validator: ^5.0.5
  melos: 7.8.1
  test: ^1.31.0
  very_good_analysis: ^10.3.0

melos:
  scripts:
    analyze:
      run: dart analyze --fatal-infos
      description: Analyze the entire workspace.
    format:
      run: dart format .
    format:check:
      run: dart format --output=none --set-exit-if-changed .
    generate:
      run: dart run melos exec --depends-on=build_runner -c 1 -o -- dart run build_runner build
    generate:check:
      run: dart run tool/generate_check.dart
    dependencies:check:
      run: dart run melos exec -c 1 -- dart run dependency_validator
    architecture:check:
      run: dart run tool/verify_architecture.dart
    features:check:
      run: dart run tool/verify_features.dart
    test:
      run: dart run melos test:unit && dart run melos test:widget
    test:unit:
      run: dart test test --test-randomize-ordering-seed=random && dart run melos exec --no-flutter --dir-exists=test -c 1 -- dart test --test-randomize-ordering-seed=random
    test:widget:
      run: dart run melos exec --flutter --scope=coder_app -c 1 -- flutter test test --exclude-tags=golden --test-randomize-ordering-seed=random
    test:contract:
      run: dart run melos exec --no-flutter --scope=coder_protocol --scope=coder_client --scope=coder_provider_openai --scope=coder_daemon -c 1 -- dart test --test-randomize-ordering-seed=random
    test:vertical-slice:
      run: dart test packages/coder_daemon/test/daemon_integration_test.dart --test-randomize-ordering-seed=random
    test:golden:
      run: dart run melos exec --flutter --scope=coder_app -c 1 -- flutter test test/golden --tags=golden --test-randomize-ordering-seed=random
    test:coverage:
      run: dart run melos exec --no-flutter --dir-exists=test -c 1 -- dart test --coverage-path=coverage/lcov.info --coverage-package="\$MELOS_PACKAGE_NAME" --branch-coverage --test-randomize-ordering-seed=random && dart run melos exec --flutter --scope=coder_app -c 1 -- flutter test --coverage --branch-coverage --exclude-tags=golden --test-randomize-ordering-seed=random && dart run tool/verify_coverage.dart
    test:e2e:linux:
      run: dart run melos exec --flutter --scope=coder_app -c 1 -- flutter test integration_test/debug_e2e_test.dart -d linux
    verify:fast:
      run: dart run melos format:check && dart run melos analyze && dart run melos dependencies:check && dart run melos architecture:check && dart run melos features:check && dart run melos generate:check && dart run melos test:unit && dart run melos test:widget && dart run melos test:contract && dart run melos test:vertical-slice
    verify:
      run: dart run melos verify:fast && dart run melos test:golden && dart run melos test:coverage
    verify:debug:
      run: dart run melos test:e2e:linux
    run:daemon:
      run: dart run packages/coder_daemon/bin/coder_daemon.dart
    run:desktop:
      # `stdio: inherit` gives flutter run a real terminal so r/R/q work; it is
      # incompatible with melos exec, hence the explicit package directory.
      run: cd apps/coder_app && flutter run -d linux -t lib/main_desktop.dart
      stdio: inherit
    run:mobile:
      run: cd apps/coder_app && flutter run -t lib/main_mobile.dart
      stdio: inherit
    build:linux:
      run: dart run melos exec --scope=coder_app -- flutter build linux --debug -t lib/main_desktop.dart
    build:android:
      run: dart run melos exec --scope=coder_app -- flutter build apk --debug -t lib/main_mobile.dart
