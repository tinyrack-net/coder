name: coder_workspace
description: Tinyrack Coder monorepo.
publish_to: none

environment:
  sdk: ^3.12.2

workspace:
  - apps/*
  - packages/*

dependencies:
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  coverage: ^1.15.1
  dependency_validator: ^5.0.5
  melos: 7.8.1
  test: ^1.31.0
  very_good_analysis: ^10.3.0

melos:
  scripts:
    analyze:
      run: dart analyze --fatal-infos
      description: Analyze the entire workspace.
    format:
      run: dart run tool/format_sources.dart
      description: Format every Dart source Git tracks or does not ignore.
    format:check:
      run: dart run tool/format_sources.dart --check
    generate:
      run: dart run melos exec --depends-on=build_runner -c 3 -o -- dart run build_runner build
    generate:check:
      run: dart run tool/generate_check.dart
    dependencies:check:
      run: dart run melos exec -c 4 -- dart run dependency_validator
    tinyrack-sources:check:
      run: dart run tool/verify_tinyrack_sources.dart
    architecture:check:
      run: dart run tool/verify_architecture.dart
    features:check:
      run: dart run tool/verify_features.dart
    embedded-ports:check:
      run: dart run tool/verify_embedded_ports.dart
    test:
      run: dart run tool/verify_workspace.dart fast
    test:dart:
      run: dart test test --concurrency=4 --test-randomize-ordering-seed=random && dart run melos exec --no-flutter --dir-exists=test -c 4 -- dart test --concurrency=1 --test-randomize-ordering-seed=random
    test:flutter:
      run: dart run melos exec --flutter --scope=coder_app -- flutter test test --concurrency=4 --exclude-tags=golden --test-randomize-ordering-seed=random
    test:unit:
      run: dart test test --concurrency=4 --test-randomize-ordering-seed=random && dart run melos exec --no-flutter --dir-exists=test -c 4 -- dart test --concurrency=1 --test-randomize-ordering-seed=random
    test:widget:
      run: dart run melos test:flutter
    test:contract:
      run: dart run melos exec --no-flutter --scope=coder_protocol --scope=coder_client --scope=coder_cli --scope=coder_provider_openai --scope=coder_daemon -c 4 -- dart test --concurrency=1 --test-randomize-ordering-seed=random
    test:vertical-slice:
      run: dart test packages/coder_daemon/test/daemon_integration_test.dart --test-randomize-ordering-seed=random
    test:golden:
      run: dart run melos exec --flutter --scope=coder_app -- flutter test test/golden --tags=golden --test-randomize-ordering-seed=random
    test:coverage:dart:
      run: dart test test --concurrency=4 --test-randomize-ordering-seed=random && dart run melos exec --no-flutter --dir-exists=test -c 4 -- dart test --concurrency=1 --coverage-path=coverage/lcov.info --coverage-package="\$MELOS_PACKAGE_NAME" --branch-coverage --test-randomize-ordering-seed=random
    test:coverage:flutter:
      run: dart run melos exec --flutter --scope=coder_app -- flutter test --coverage --concurrency=4 --branch-coverage --exclude-tags=golden --test-randomize-ordering-seed=random
    coverage:check:
      run: dart run tool/verify_coverage.dart
    test:coverage:
      run: dart run tool/verify_workspace.dart coverage
    test:e2e:linux:
      run: dart run melos exec --flutter --scope=coder_app -c 1 -- dart run ../../tool/run_linux_e2e.dart
    verify:fast:
      run: dart run tool/verify_workspace.dart fast
    verify:
      run: dart run tool/verify_workspace.dart full
    verify:debug:
      run: dart run melos test:e2e:linux
    run:daemon:
      # Built, not `dart run`: the CLI hosts the daemon and links the sqlite3
      # and PTY code assets, which only `dart build cli` produces. Under `dart
      # run` the build hooks never execute and startup fails on a missing
      # `sqlite3_initialize`.
      run: dart run melos build:cli && dist/bundle/bin/coder_cli daemon start
      stdio: inherit
    run:cli:
      # Built for the same reason as `run:daemon`.
      run: dart run melos build:cli && dist/bundle/bin/coder_cli
      stdio: inherit
    build:cli:
      # `dart build cli` rather than `dart compile exe`: the CLI now hosts the
      # daemon, so it links sqlite3 and the PTY code assets and ships as
      # `dist/bundle/bin` plus `dist/bundle/lib`.
      run: dart build cli -t packages/coder_cli/bin/coder_cli.dart -o dist
    run:desktop:
      # `stdio: inherit` gives flutter run a real terminal so r/R/q work; it is
      # incompatible with melos exec, hence the explicit package directory.
      run: cd apps/coder_app && flutter run -d linux -t lib/main_desktop.dart
      stdio: inherit
    run:mobile:
      run: cd apps/coder_app && flutter run -t lib/main_mobile.dart
      stdio: inherit
    build:linux:
      run: dart run melos exec --scope=coder_app -- flutter build linux --debug -t lib/main_desktop.dart
    build:android:
      run: dart run melos exec --scope=coder_app -- flutter build apk --debug -t lib/main_mobile.dart
    build:macos:
      run: dart run melos exec --scope=coder_app -- flutter build macos --debug -t lib/main_desktop.dart
    build:windows:
      run: dart run melos exec --scope=coder_app -- flutter build windows --debug -t lib/main_desktop.dart
    build:web:
      run: dart run melos exec --scope=coder_app -- flutter build web -t lib/main_web.dart
    build:web:release:
      run: dart run melos exec --scope=coder_app -- flutter build web --release -t lib/main_web.dart
    build:linux:release:
      run: dart run melos exec --scope=coder_app -- flutter build linux --release -t lib/main_desktop.dart
    build:macos:release:
      run: dart run melos exec --scope=coder_app -- flutter build macos --release -t lib/main_desktop.dart
    build:windows:release:
      run: dart run melos exec --scope=coder_app -- flutter build windows --release -t lib/main_desktop.dart
