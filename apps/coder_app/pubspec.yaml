name: coder_app
description: Cross-platform GUI for Tinyrack Coder.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  coder_client: ^0.1.0
  coder_daemon: ^0.1.0
  coder_protocol: ^0.1.0
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: 3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  intl: any
  launch_at_startup: ^0.5.1
  lucide_flutter: ^1.25.0
  meta: ^1.17.0
  riverpod_annotation: 4.0.3
  share_plus: ^11.0.0
  shared_preferences: ^2.5.4
  super_clipboard: ^0.9.1
  super_drag_and_drop: ^0.9.1
  tinyrack_ui:
    git:
      url: https://github.com/tinyrack-net/design.git
      ref: 8d7b2071e0682cf467d3ea6f5ac373bfbc8d70ab
      path: packages/ui_flutter
  tray_manager: ^0.5.3
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  window_manager: ^0.5.2

dev_dependencies:
  alchemist: ^0.14.0
  build_runner: 2.15.1
  coder_agent: ^0.1.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.4.0
  integration_test:
    sdk: flutter
  riverpod_generator: 4.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/tray/
