name: coder_app
description: Cross-platform GUI for Tinyrack Coder.
publish_to: none
version: 0.2.0+2
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  coder_client: ^0.1.0
  coder_daemon: ^0.1.0
  coder_protocol: ^0.1.0
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: 3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  intl: any
  launch_at_startup: ^0.5.1
  lucide_flutter: ^1.25.0
  meta: ^1.17.0
  riverpod_annotation: 4.0.3
  share_plus: ^11.0.0
  shared_preferences: ^2.5.4
  super_clipboard: ^0.9.1
  super_drag_and_drop: ^0.9.1
  tinyrack_ui:
    git:
      url: https://github.com/tinyrack-net/design.git
      ref: 64c9ce0b27a88bf8e04d77e5f7f4bc941ba05f05
      path: packages/ui_flutter
  tray_manager: ^0.5.3
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  window_manager: ^0.5.2

dev_dependencies:
  alchemist: ^0.14.0
  build_runner: 2.15.1
  coder_agent: ^0.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.4.0
  integration_test:
    sdk: flutter
  riverpod_generator: 4.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/tray/
    # The boot splash paints the brand mark before the app tree exists.
    - assets/brand/coder-256.png

# Regenerate every native launcher icon from the Tinyrack brand master with
# `dart run flutter_launcher_icons`. The 1024px source is rasterized from
# `@tinyrack/ui`'s `brand/apps/coder-app-icon.svg`; edit the icon upstream in
# the design repository rather than retouching anything generated here.
flutter_launcher_icons:
  image_path: assets/brand/coder-1024.png
  android: true
  # The tile is already dark, so the adaptive background matches it and the
  # glyph rides in the foreground safe zone.
  adaptive_icon_background: "#0a0a0a"
  adaptive_icon_foreground: assets/brand/coder-adaptive-foreground.png
  ios: true
  # App Store rejects launcher icons with an alpha channel.
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/brand/coder-1024.png
  windows:
    generate: true
    image_path: assets/brand/coder-1024.png
    icon_size: 256
  web:
    generate: true
    image_path: assets/brand/coder-1024.png
    background_color: "#0a0a0a"
    theme_color: "#0a0a0a"
