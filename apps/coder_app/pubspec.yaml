publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  coder_client: ^0.1.0
  coder_daemon: ^0.1.0
  coder_protocol: ^0.1.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.3.1
