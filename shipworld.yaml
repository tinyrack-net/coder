schema: 1
remote: origin
batch-commit: "release: {targets}"

targets:
  coder:
    # The build number is what Apple and Android increment per release, and
    # `flutter-application` is the kind that bumps it.
    kind: flutter-application
    # Rooted at the repository so the daemon's version file stays in reach of
    # the app's pubspec, which is the single source of truth.
    root: .
    version:
      source: apps/coder_app/pubspec.yaml
      synchronized:
        - type: dart-constant
          path: apps/coder_app/lib/src/version.g.dart
        - type: dart-constant
          path: packages/coder_daemon/lib/src/version.g.dart
        - type: dart-constant
          path: packages/coder_cli/lib/src/version.g.dart
    tag: "v{version}"
    commit: "release: v{version}"
    branch: main
    payload:
      # The Linux launcher; macOS and Windows override it per platform because
      # their bundles nest the executable differently.
      kind: directory
      launcher: coder
    product:
      name: coder
      display-name: Coder
      description: Local-first AI coding agent with an always-on daemon
      executable: coder
      homepage: https://github.com/tinyrack-net/coder
      repository: tinyrack-net/coder
    windows:
      application-id: Coder
      executable: coder.exe
      background-color: "#625bff"
      identity:
        name-env: MSIX_IDENTITY_NAME
        publisher-env: MSIX_PUBLISHER
        publisher-display-name-env: MSIX_PUBLISHER_DISPLAY_NAME
        display-name-env: MSIX_DISPLAY_NAME
    macos:
      entitlements: apps/coder_app/macos/Runner/Release.entitlements
      bundle-name: Coder
      bundle-id: net.tinyrack.coder
      # SMAppService, used for the login item, needs macOS 13.
      minimum-version: ventura
    linux:
      icon: apps/coder_app/assets/brand/coder.svg
      categories:
        - Development
      terminal: false
      maintainer: "Tinyrack <dev@tinyrack.net>"
      license: MIT
      vendor: Tinyrack
      app-id: net.tinyrack.coder
      icons:
        - { size: 0, path: apps/coder_app/assets/brand/coder.svg }
        - { size: 128, path: apps/coder_app/assets/brand/coder-128.png }
        - { size: 256, path: apps/coder_app/assets/brand/coder-256.png }
        - { size: 512, path: apps/coder_app/assets/brand/coder-512.png }
      deb:
        # GTK is the Flutter shell; the indicator library backs the tray icon.
        # Ubuntu 24.04 renamed libgtk-3-0 during the time_t transition.
        depends:
          - libgtk-3-0t64
          - libayatana-appindicator3-1
        section: devel
      rpm:
        requires:
          - gtk3
          - libayatana-appindicator-gtk3
        release: "1"
        group: Development/Tools

  coder-cli:
    kind: cli-application
    root: .
    version:
      # The CLI rides the application's version and tag so that one release
      # ships a matching daemon, desktop app, and command line. Its version
      # file is written by the `coder` target above, which is why nothing is
      # synchronized here.
      source: apps/coder_app/pubspec.yaml
    tag: "v{version}"
    commit: "release: v{version}"
    branch: main
    payload:
      # A directory rather than a bare executable: hosting the daemon links
      # sqlite3 and the PTY code assets, so `dart build cli` emits `bin/` plus
      # the `lib/` the executable loads at runtime.
      kind: directory
      launcher: coder-cli
    product:
      name: coder-cli
      display-name: Coder CLI
      description: Command line that hosts and administers a Tinyrack Coder daemon
      executable: coder-cli
      homepage: https://github.com/tinyrack-net/coder
      repository: tinyrack-net/coder
    macos:
      entitlements: packages/coder_cli/macos/Release.entitlements
      bundle-id: net.tinyrack.coder.cli
    homebrew:
      # No Linux arm64: building the CLI needs the Flutter SDK, because it
      # shares a pub workspace with the app, and Flutter publishes no Linux
      # arm64 SDK. Claiming it would point the Formula at an artifact the
      # release does not carry.
      platforms:
        - macos-arm64
        - macos-x64
        - linux-x64
      formula-class: CoderCli
      # shipworld reads `<prefix>-<platform>-<arch>` bare executables from the
      # artifacts directory and installs them under this name.
      artifact-prefix: coder-cli
