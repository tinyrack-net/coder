name: ime_delta_probe
description: Throwaway probe that records the flutter/textinput channel while typing into a termworld TerminalView.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  termworld:
    git:
      url: https://github.com/tinyrack-net/flutter-packages
      path: packages/termworld
      ref: e7d3b14f57684d2a8db910ecf24f6d3e1860582e

flutter:
  uses-material-design: true
